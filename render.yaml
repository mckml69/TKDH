# Render "Blueprint" — lets Render read this file and pre-fill a new Web Service's
# settings automatically instead of you typing them in by hand. See DEPLOY.md for
# the full walkthrough (this file alone doesn't explain what to click where).
#
# What this describes: ONE service that builds the frontend (Vite) and installs the
# backend's dependencies, then runs the backend, which serves the built frontend
# itself (see server/index.js) — so the whole app is one deployable unit, not two.
services:
  - type: web
    name: compliance-ledger
    runtime: node
    plan: starter
    # --include=dev is required here: NODE_ENV=production (set below) makes npm skip
    # devDependencies by default, which is where vite itself lives — without this flag
    # the build step fails with "vite: not found" even though vite is listed in package.json.
    buildCommand: "npm install --include=dev && npm run build && cd server && npm install"
    startCommand: "node server/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/data.sqlite
      # VITE_STORAGE_MODE is a BUILD-time variable — Vite bakes it into the bundle
      # during "npm run build", it isn't read at runtime. .env (which normally sets
      # this locally) is gitignored on purpose, so it must be set here or the deployed
      # build silently falls back to "local" mode (the no-server, no-real-auth,
      # name-picker sign-in) instead of the real password-based login.
      - key: VITE_STORAGE_MODE
        value: api
      # CORS_ORIGIN isn't needed here — the frontend and backend share an origin in
      # this setup, so no cross-origin requests happen. It only matters for local dev.
      # Cloudflare R2 attachment storage — optional (see server/r2.js and
      # server/.env.example), but "sync: false" means Render won't accept a value from
      # this file even if one were added here; it must be typed into the dashboard
      # directly (Environment tab) so the actual secret never lives in the repo.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
    disk:
      name: compliance-ledger-data
      mountPath: /var/data
      sizeGB: 1
